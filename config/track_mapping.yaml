# Requirement text -> "does this requirement need track data?" keywords.
#
# The track_data/ folder holds one HTML subdivision report per subdivision
# (08101, 08880, ...). Rather than hardcoding which subdivision each
# requirement uses, a requirement is flagged as track-relevant when its text
# mentions any of the keywords below (case-insensitive substring match). When
# flagged, the UI offers a dropdown of the subdivisions actually present in
# the ingested data so a person can pick the right one — the keyword can say
# track data is relevant, but not which subdivision, so that choice is
# always made by a human.
#
# Add a term here when a new track-feature category should trigger the
# dropdown.

keywords:
  - Blocks
  - Switches
  - "Signals, Communicating"
  - "Signals, Non-Communicating"
  - Cab Signal Dropouts
  - Clearance Points
  - Device Status Table
  - DOT Numbers
  - Energy Management Parameters
  - Highway Crossings
  - Highway Crossings Quiet Day
  - Licenses
  - Linkages
  - Milepost Markers
  - Non-Comm Area
  - Signage
  - Speed Enforcement Cab Code Rate
  - Speed Restrictions
  - Track Names
  - Track Speeds
  - Wayside Devices
  - Wayside Interface Units
  - Wireless Crossing Activation
  - Wireless Crossing Island
