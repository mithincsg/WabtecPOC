# Every folder the app reads. All of them are parsed from disk on startup
# into one in-process BM25 index (src/rag/static_context.py) — nothing is
# embedded and there is no vector store.
static_sources:
  - path: data/python_apis
    document_type: python_apis
    subfolders_as_type: false
  - path: data/track_data
    document_type: track_data
    subfolders_as_type: false
  - path: data/parameter_config
    document_type: parameter_config
    subfolders_as_type: false
  - path: data/ICD_data
    document_type: icd
    subfolders_as_type: false


examples_dir: data/Examples

caf_mapping_file: config/caf_mapping.json

# --- Chunking ------------------------------------------------------------

chunk_max_tokens: 512

chunk_overlap_tokens: 50

xlsx_max_rows_per_chunk: 1


pdf_heading_size_ratio: 1.15

pdf_table_repeat_threshold: 0.5

