# Knowledge-base ingestion. Retrieval/generation settings: rag_config.yaml.

# Source roots. `document_type` is stamped on every chunk and is what the retriever filters on.
# `subfolders_as_type: true` lets an immediate subfolder name override it, with no code change.
sources:
  - path: data/knowledge_base
    document_type: knowledge_base
    subfolders_as_type: true
  # Disabled: only data/knowledge_base is embedded into the vector DB.
  # - path: data/python_apis
  #   document_type: python_apis
  # - path: data/track_data
  #   document_type: track_data

# Parsed the same way, but never embedded - held in an in-process BM25-only index
# (src/rag/retrieval.py). python_apis is one big stub file and track_data thousands of
# per-subdivision rows: not prose an embedding model gains from, and both full of exact
# identifiers keyword search already handles better.
static_sources:
  - path: data/python_apis
    document_type: python_apis
    subfolders_as_type: false
  - path: data/track_data
    document_type: track_data
    subfolders_as_type: false

# requirement -> reference test cases -> reference script triples, sent to the LLM under a
# character budget as a shape template only. Never searched, never a source of values.
examples_dir: data/Examples

# Chunking. Structure decides the boundaries; these are only a ceiling for a single
# oversized unit. 512 is well under bge-m3's 8192 limit and favours retrieval precision.
# Changing any of these re-embeds the whole KB once (the pipeline fingerprint changes).
chunk_max_tokens: 512
# Applied only when a unit had to be split, never between two separate units.
chunk_overlap_tokens: 50
# 1 = each spreadsheet row (one logical test case) is its own chunk.
xlsx_max_rows_per_chunk: 1

# PDF structure detection. Unnumbered headings must be bold and this much larger than body text.
pdf_heading_size_ratio: 1.15
# A table repeated on >= this fraction of pages is running boilerplate.
pdf_table_repeat_threshold: 0.5

# Embeddings.
embedding_model: BAAI/bge-m3
embedding_batch_size: 16
embedding_device: auto   # auto | cpu | cuda

# Vector store.
chroma_persist_dir: chroma_db
chroma_collection: kb_collection
