# --- Retrieval + generation ---------------------------------------------

# Every source is keyword-searched (BM25) from the in-process static index;
# there is no dense arm and no vector store, so these are match counts, not
# fused-ranking ones.

static_api_top_k: 20         # python_apis method/class chunks per request.

static_track_top_k: 2        # track-XML chunks per request (filtered to the
                              # subdivision picked in the UI)
static_parameter_top_k: 4    # TBC/CFG/THE parameter records per request
static_icd_top_k: 2          # ICD message-field decodings (Train Type codes,
                              # enumerations, ranges) per request
static_message_object_top_k: 2   # office-message objects (script call only) --
                              # the message(s) a requirement's own wording
                              # identifies (e.g. wcr_office_01041 for a
                              # "work zone" bulletin requirement), each sent
                              # as a full, object-qualified method listing



# --- Generation (Ollama) -------------------------------------------------
ollama_host: http://localhost:11434
llm_model: qwen3:30b
llm_temperature: 0.1
llm_max_tokens: 14336
llm_num_ctx: 24576
llm_request_timeout_seconds: 0
llm_stall_timeout_seconds: 0
llm_keep_alive: 30m
llm_num_threads: 8
llm_think: off
max_test_cases: 20
script_max_tokens: 20480
