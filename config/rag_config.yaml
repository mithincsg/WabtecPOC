# --- Retrieval + generation ---------------------------------------------
# Ingestion-only settings live in config/config.yaml. This file controls
# what happens once the knowledge base is already ingested.

# Must match what config/config.yaml ingested into, and the model it used —
# query vectors are only comparable to stored vectors from the same model.
chroma_persist_dir: chroma_db
chroma_collection: kb_collection
embedding_model: BAAI/bge-m3
embedding_device: auto   # auto | cpu | cuda

# --- Hybrid search -------------------------------------------------------
# Dense (BGE-M3 cosine) and keyword (BM25) run as two independent rankings
# and are fused with reciprocal rank fusion. Weights are relative, not
# required to sum to 1; set one to 0 to disable that arm.
retrieval_top_k: 8           # chunks handed to the LLM after fusion
candidates_per_arm: 30       # depth each arm searches before fusion
dense_weight: 1.0
keyword_weight: 0.6
rrf_k: 60                    # RRF damping; higher = flatter rank influence
min_similarity: 0.0          # 0..1 dense cosine floor; 0 = keep everything
max_context_chars: 7000      # cap on context text fed to the LLM

# [] = search every ingested document_type. Track data is always filtered
# separately, by the requirement -> subdivision map in track_mapping.yaml.
doc_types: []
track_data_doc_type: track_data
track_data_top_k: 4          # track-feature chunks added on top of top_k

# --- Static context (config/config.yaml: static_sources, examples_dir) ---
# python_apis and track_data are BM25-only here (never embedded — see
# config.yaml), so these are keyword-match counts, not fused-ranking ones.
static_api_top_k: 4          # python_apis method/class chunks per request
static_track_top_k: 4        # track-feature chunks per request (still
                              # filtered to the requirement's subdivisions)

# --- Generation (Ollama) -------------------------------------------------
ollama_host: http://localhost:11434
llm_model: qwen2.5:7b
llm_temperature: 0.2
llm_top_p: 0.9
llm_max_tokens: 1280
llm_num_ctx: 8192
llm_request_timeout_seconds: 900
# Keeps the model resident between requests. A 7B model on CPU takes tens
# of seconds to load; without this, every request pays that cost again.
llm_keep_alive: 30m
# 0 = let Ollama pick. Set to your physical core count (not threads) if
# generation is slower than expected.
llm_num_threads: 0

# How many test cases a requirement needs is derived from the requirement
# itself — one per verifiable behaviour it specifies — so there is no target
# count to configure. This is only the ceiling that stops a sprawling
# requirement from asking for a response longer than llm_max_tokens can hold.
max_test_cases: 20

# --- Test-script generation ---------------------------------------------
# The script call is a second, longer generation, so it gets its own budget.
script_max_tokens: 1792

# --- Confidence scoring --------------------------------------------------
# Every generated test case gets three component scores, combined into one
# overall score with these weights (normalised internally):
#   retrieval  - how strong the supporting KB context was
#   grounding  - how much of the test case's wording traces back to that
#                context rather than being invented
#   similarity - cosine similarity of the generated test case against the
#                closest existing test case for the same requirement
confidence_weights:
  retrieval: 0.3
  grounding: 0.3
  similarity_to_existing: 0.4
# Below this, the UI flags the test case for review.
confidence_review_threshold: 0.55
